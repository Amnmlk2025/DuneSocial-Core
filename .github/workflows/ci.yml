name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # لازم برای دسترسی کامل تاریخچه و main

      - name: Run guardrails
        run: |
          python3 ci/guardrails/check_changes.py

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -c backend/pytest.ini
